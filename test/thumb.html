<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>썸네일</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
  :root{ --ink:#141820; --muted:#5F6B76; --acc1:#2563EB; --acc2:#0D9488; --sans:"Pretendard Variable",Pretendard,"Malgun Gothic",sans-serif; }
  *{box-sizing:border-box;margin:0}
  html,body{width:100%;height:100%;overflow:hidden;font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased;word-break:keep-all}
  .frame{position:relative;overflow:hidden;background:
    radial-gradient(60% 70% at 88% 82%, color-mix(in srgb,var(--acc1) 26%,white) 0%, transparent 70%),
    radial-gradient(45% 55% at 10% 10%, color-mix(in srgb,var(--acc2) 22%,white) 0%, transparent 70%),
    linear-gradient(160deg,#FFFFFF 0%,#F4F7FB 100%)}
  .blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.55}
  .b1{background:var(--acc1);width:46%;aspect-ratio:1;right:-8%;bottom:-18%}
  .b2{background:var(--acc2);width:30%;aspect-ratio:1;left:-8%;top:-12%;opacity:.4}
  .halo{position:absolute;border-radius:50%;background:rgba(255,255,255,.55);border:1.5px solid rgba(255,255,255,.9);backdrop-filter:blur(20px);box-shadow:0 30px 80px -30px color-mix(in srgb,var(--acc1) 45%,transparent), inset 0 1px 0 rgba(255,255,255,.9)}
  .char{position:absolute;object-fit:contain;filter:drop-shadow(0 30px 40px rgba(20,24,32,.22))}
  .txt{position:absolute;display:flex;flex-direction:column;gap:22px;align-items:flex-start}
  .row{display:flex;align-items:center;gap:14px}
  .brand{display:inline-flex;align-items:center;gap:12px;padding:12px 22px;border-radius:999px;background:rgba(255,255,255,.7);border:1.5px solid rgba(255,255,255,.95);backdrop-filter:blur(16px);box-shadow:0 10px 30px -14px color-mix(in srgb,var(--acc1) 40%,transparent);font-weight:800;color:var(--ink);white-space:nowrap}
  .brand i{width:14px;height:14px;border-radius:50%;background:var(--acc1);display:inline-block;box-shadow:0 0 0 5px color-mix(in srgb,var(--acc1) 22%,transparent)}
  .no{display:inline-flex;align-items:center;padding:12px 22px;border-radius:999px;background:var(--acc2);color:#fff;font-weight:900;letter-spacing:.02em;box-shadow:0 12px 30px -14px color-mix(in srgb,var(--acc2) 70%,transparent)}
  h1{font-weight:900;line-height:1.16;letter-spacing:-.025em;text-wrap:balance;width:100%}
  h1 em{font-style:normal;color:var(--acc1)}
  .sub{display:inline-flex;padding:14px 26px;border-radius:22px;background:rgba(255,255,255,.62);border:1.5px solid rgba(255,255,255,.95);backdrop-filter:blur(16px);font-weight:700;color:var(--muted);box-shadow:0 10px 30px -14px rgba(20,24,32,.25)}
  .foot{position:absolute;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:12px;white-space:nowrap}
  .foot b{color:var(--ink)}
  .track{display:inline-flex;padding:6px 14px;border-radius:999px;border:1.5px solid color-mix(in srgb,var(--acc1) 40%,white);color:var(--acc1);background:rgba(255,255,255,.7);font-weight:800}
  /* 유튜브 1920×1080 */
  .yt{width:1920px;height:1080px}
  .yt .halo{width:1000px;height:1000px;right:-60px;bottom:-330px}
  .yt .char{right:90px;bottom:-40px;height:960px}
  .yt .txt{left:110px;top:120px;width:1020px}
  .yt .brand{font-size:32px} .yt .no{font-size:32px}
  .yt h1{font-size:112px} .yt .sub{font-size:38px}
  .yt .foot{left:110px;bottom:84px;font-size:30px}
  /* 인스타 4:5 1080×1350 */
  .ig{width:1080px;height:1350px}
  .ig .halo{width:1000px;height:1000px;left:50%;transform:translateX(-50%);bottom:-420px}
  .ig .char{left:50%;transform:translateX(-50%);bottom:-40px;height:820px}
  .ig .txt{left:80px;top:96px;width:920px;gap:26px}
  .ig .brand{font-size:30px} .ig .no{font-size:30px}
  .ig h1{font-size:96px} .ig .sub{font-size:36px}
  .ig .foot{position:static;font-size:26px;margin-top:6px}
  /* 인스타 릴스·스토리 9:16 1080×1920 */
  .rl{width:1080px;height:1920px}
  .rl .halo{width:1100px;height:1100px;left:50%;transform:translateX(-50%);bottom:-380px}
  .rl .char{left:50%;transform:translateX(-50%);bottom:40px;height:1040px}
  .rl .txt{left:80px;top:220px;width:920px;gap:28px}
  .rl .brand{font-size:32px} .rl .no{font-size:32px}
  .rl h1{font-size:104px} .rl .sub{font-size:38px}
  .rl .foot{position:static;font-size:28px;margin-top:8px}
</style>
</head>
<body>
<div class="frame" id="frame">
  <div class="blob b1"></div><div class="blob b2"></div>
  <div class="halo"></div>
  <img class="char" id="char" alt="">
  <div class="txt">
    <div class="row"><span class="brand"><i></i>쿼카의 AI 개념극장</span><span class="no" id="no">E01</span></div>
    <h1 id="title"></h1>
    <span class="sub" id="sub"></span>
  </div>
  <div class="foot"><span class="track" id="track"></span><span>AI융합교육연구회 <b>Q.U.O.K.A</b></span></div>
</div>
<script type="module">
  import { EPISODES } from '../engine/registry.js';
  import { PALETTES, DEFAULT_PALETTE } from '../engine/palette.js';
  const q = new URLSearchParams(location.search);
  const slug = q.get('ep') || 'e1-agent-mcp', fmt = q.get('fmt') || 'yt';
  const e = EPISODES.find(x => x.slug === slug);
  const ep = (await import(new URL('../' + e.file, import.meta.url))).default;
  const p = PALETTES[slug] || DEFAULT_PALETTE;
  const frame = document.getElementById('frame');
  frame.classList.add(fmt);
  frame.style.setProperty('--acc1', p.a1); frame.style.setProperty('--acc2', p.a2);
  if (fmt === 'ig' || fmt === 'rl') document.querySelector('.txt').append(document.querySelector('.foot'));
  document.getElementById('no').textContent = 'E' + String(e.no).padStart(2, '0');
  const t = document.getElementById('title');
  /* 'AI' 글자만 강조색 */
  t.innerHTML = ep.title.replace(/AI/g, '<em>AI</em>');
  document.getElementById('sub').textContent = ep.subtitle;
  document.getElementById('track').textContent = ep.track === 'A' ? '트랙 A · 영상 만들기' : ep.track === 'C' ? '트랙 C · 심화' : '트랙 B · AI와 대화';
  const img = document.getElementById('char');
  img.src = new URL(`../assets/key/${slug}.webp`, import.meta.url);
  await img.decode().catch(() => {});
  await document.fonts.ready;
  /* 긴 제목은 자동으로 줄여서 정해진 줄 수 안에 */
  const maxLines = { yt: 3, ig: 4, rl: 4 }[fmt];
  const limitH = { yt: 1080 - 120 - 84 - 120, ig: 1350 - 96 - 560, rl: 1920 - 220 - 1000 }[fmt];
  const txt = document.querySelector('.txt');
  let fs = parseFloat(getComputedStyle(t).fontSize);
  while (fs > 40 && (t.getBoundingClientRect().height > fs * 1.16 * maxLines + 4 || txt.getBoundingClientRect().height > limitH)) { fs -= 4; t.style.fontSize = fs + 'px'; }
  /* 세로형: 글 블록이 길면 캐릭터를 그만큼 줄여서 절대 겹치지 않게 */
  if (fmt === 'ig' || fmt === 'rl') {
    const H = fmt === 'ig' ? 1350 : 1920, bottomGap = fmt === 'ig' ? -40 : 40, maxH = fmt === 'ig' ? 820 : 1040;
    const txtBottom = txt.getBoundingClientRect().bottom;
    const hh = Math.min(maxH, H - bottomGap - (txtBottom + 36));
    img.style.height = hh + 'px';
  }
  window.__ready = true;
</script>
</body>
</html>
