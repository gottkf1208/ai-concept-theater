<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>흐름도</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f5f7}</style>
</head>
<body>
<!-- 쿼카 모션랩 · 흐름도 (Flow Chart) -->
<!-- 글꼴: 마루 부리 (OFL (네이버)) · 프리텐다드 (OFL) · 눈누(noonnu.cc)의 무료 한글 글꼴 -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=Noto+Sans+KR:wght@100..900&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
@font-face{font-family:'MaruBuri';font-style:normal;font-weight:200;font-display:swap;src:url(https://hangeul.pstatic.net/hangeul_static/webfont/MaruBuri/MaruBuri-ExtraLight.woff2) format('woff2')}@font-face{font-family:'MaruBuri';font-style:normal;font-weight:300;font-display:swap;src:url(https://hangeul.pstatic.net/hangeul_static/webfont/MaruBuri/MaruBuri-Light.woff2) format('woff2')}@font-face{font-family:'MaruBuri';font-style:normal;font-weight:400;font-display:swap;src:url(https://hangeul.pstatic.net/hangeul_static/webfont/MaruBuri/MaruBuri-Regular.woff2) format('woff2')}@font-face{font-family:'MaruBuri';font-style:normal;font-weight:600;font-display:swap;src:url(https://hangeul.pstatic.net/hangeul_static/webfont/MaruBuri/MaruBuri-SemiBold.woff2) format('woff2')}@font-face{font-family:'MaruBuri';font-style:normal;font-weight:700;font-display:swap;src:url(https://hangeul.pstatic.net/hangeul_static/webfont/MaruBuri/MaruBuri-Bold.woff2) format('woff2')}
</style>
<div id="qm-flow-chart" style="width:100%;max-width:calc(100vh * 1)"></div>
<script>
(function () {
  // ① 설정: 여기만 고치면 됩니다
  const CONFIG = {
    speed: 1,          // 속도 (1 = 기본, 2 = 두 배)
    bg: '#f5f5f7',     // 배경색 ('transparent'로 바꾸면 투명)
    colors: ['#ffffff', '#e8ecf3', '#cfd7e6', '#9aa8c4', '#5c7099', '#1f3460', '#6e1a2f', '#15171c'],   // 색 8개: 밝은 색 → 진한 색 ([5] 포인트 색, [7] 글자색)
    ratio: '1 / 1'     // 화면 비율 (가로 / 세로)
  };

  // ② 모션: 흐름도
  function qmKit(api) {
    const clamp = x => Math.max(0, Math.min(1, x));
    const kit = {
      sans: '"Pretendard Variable","Pretendard","Noto Sans KR",' + api.font,    // 기본 글꼴: 프리텐다드 하나로 한글·영문을 함께 (한 줄 안에서 글꼴이 섞이지 않게)
      serif: '"Instrument Serif","MaruBuri","Noto Serif KR","Times New Roman",serif',     // 강조 한마디에 쓰는 세리프 (영문은 기울임과 잘 어울리는 Instrument Serif, 한글이 섞인 글줄은 마루 부리 하나로)
      mono: '"JetBrains Mono","Pretendard Variable",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace',   // 작은 라벨·숫자 (한글이 섞인 라벨은 프리텐다드 하나로)
      clamp: clamp,
      seg: (t, a, b) => clamp((t - a) / (b - a)),                 // t가 a~b 사이 어디쯤인지 0~1로
      mix: (a, b, p) => a + (b - a) * p,
      out: x => 1 - Math.pow(1 - clamp(x), 4),                    // 빠르게 출발해 부드럽게 멈춤 (cubic-bezier(.22,1,.36,1)과 비슷)
      expo: x => { x = clamp(x); return x >= 1 ? 1 : 1 - Math.pow(2, -10 * x); },   // 더 급하게 출발해 길게 멈춤 (cubic-bezier(.16,1,.3,1)과 비슷)
      into: x => Math.pow(clamp(x), 3),                           // 천천히 출발해 빠르게 빠져나감
      io: x => { x = clamp(x); return x < 0.5 ? 8 * x * x * x * x : 1 - Math.pow(-2 * x + 2, 4) / 2; },   // 천천히-빠르게-천천히 (cubic-bezier(.76,0,.24,1)과 비슷)
      // 글자를 쪼개 parent에 넣음. by: 'line'(줄바꿈 \n 기준) | 'word' | 'char'
      // 조각마다 가림막(overflow:hidden) 하나와 그 안에서 움직일 알맹이 하나가 생깁니다. 돌려주는 값: 알맹이 목록
      split(parent, text, by) {
        const units = by === 'line' ? String(text).split('\n') : by === 'word' ? String(text).split(/(\s+)/) : Array.from(String(text));
        const parts = [];
        units.forEach(unit => {
          if (!unit) return;
          if (by !== 'line' && /^\s+$/.test(unit)) { parent.appendChild(document.createTextNode(unit.indexOf('\n') >= 0 ? '\n' : ' ')); return; }
          const mask = document.createElement('span'), core = document.createElement('span');
          // 가림막은 위아래로 조금 넉넉하게 (받침·꼬리가 잘리지 않게), 그만큼 바깥 여백을 당겨 줄 간격은 그대로 둠
          mask.style.cssText = `display:${by === 'line' ? 'block' : 'inline-block'};overflow:hidden;vertical-align:top;padding:.14em 0;margin:-.14em 0;` + (by === 'line' ? '' : 'white-space:pre;');
          core.style.cssText = `display:${by === 'line' ? 'block' : 'inline-block'};will-change:transform;`;
          core.textContent = unit;
          mask.appendChild(core);
          parent.appendChild(mask);
          parts.push(core);
        });
        return parts;
      },
      // 조각들이 차례로 아래에서 올라옴: p는 전체 진행 0~1, gap은 조각 사이 시차(전체의 몇 분의 일), 올라온 뒤 그대로 있음
      rise(parts, p, gap) {
        const each = 1 - (gap || 0.5), n = Math.max(1, parts.length - 1);
        parts.forEach((el, i) => {
          const q = kit.expo(kit.seg(p, (i / n) * (1 - each), (i / n) * (1 - each) + each));
          el.style.transform = `translate3d(0,${(1 - q) * 108}%,0)`;
        });
      },
      // 작은 라벨 (대문자, 자간 넓게)
      label(parent, text, px, color) {
        const el = document.createElement('span');
        el.textContent = text;
        el.style.cssText = `display:block;font:500 ${px}px/1.2 ${kit.mono};letter-spacing:.12em;text-transform:uppercase;color:${color || api.fg};white-space:nowrap;`;
        parent.appendChild(el);
        return el;
      }
    };
    return kit;
  }

  function chartKit(api) {
    const kit = qmKit(api), W = api.W, H = api.H, u = api.u, NS = 'http://www.w3.org/2000/svg';
    const rgb = c => /^#[0-9a-f]{6}$/i.test(c) ? [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16)) : [128, 128, 128];
    const light = c => { const v = rgb(c); return (v[0] * 299 + v[1] * 587 + v[2] * 114) / 1000; };   // 색의 밝기 0~255
    const vivid = c => { const v = rgb(c); return Math.max(v[0], v[1], v[2]) - Math.min(v[0], v[1], v[2]) > 25; };   // 무채색이 아닌지
    const d = {
      kit: kit, W: W, H: H, u: u,
      mx: W * 0.07, my: H * 0.07,                        // 안전 여백 (가로, 세로)
      wide: W > H * 1.3, tall: H > W * 1.3,              // 가로로 긴 화면, 세로로 긴 화면
      hair: Math.max(1, u * 0.0025),                     // 가는 줄 굵기
      mono: kit.mono.replace(',', ',"Noto Sans KR",'),   // 작은 라벨 글꼴 (한글은 Noto Sans KR로 보임)
      tint: (c, a) => `rgba(${rgb(c).join(',')},${a})`,  // 색을 반투명하게
      // 이 바탕에서 또렷이 보이는 포인트 색 하나 (바탕에 묻히는 색은 건너뜀, 마땅한 색이 없으면 글자색)
      hot: [api.accent, api.deep, api.tone(3)].find(c => c !== api.fg && vivid(c) && Math.abs(light(c) - light(api.bg)) > 70) || api.fg,
      // 빈 상자 하나: 왼쪽 위 (x, y), 크기 (w, h). 크기를 null로 두면 내용에 맞춰짐
      box(parent, x, y, w, h, css) {
        const el = document.createElement('div');
        el.style.cssText = `position:absolute;left:${x}px;top:${y}px;` + (w == null ? '' : `width:${w}px;`) + (h == null ? '' : `height:${h}px;`) + (css || '');
        parent.appendChild(el);
        return el;
      },
      // 가림막 안의 글자 한 줄. (x, y)는 align('left'|'center'|'right') 기준점과 글자 상자의 윗선
      // 돌려주는 값은 알맹이이고, d.slide(알맹이, 들어옴, 나감)으로 움직입니다
      text(parent, str, x, y, px, css, align) {
        const mask = document.createElement('div'), core = document.createElement('div'), side = px * 0.08;
        mask.style.cssText = `position:absolute;left:${x}px;top:${y}px;overflow:hidden;white-space:nowrap;padding:${px * 0.16}px ${side}px;margin:${-px * 0.16}px ${-side}px;` +
          (align === 'right' ? `transform:translateX(calc(-100% + ${side * 2}px));` : align === 'center' ? `transform:translateX(calc(-50% + ${side}px));` : '');
        core.style.cssText = `font:500 ${px}px/1.2 ${kit.sans};letter-spacing:-.01em;color:${api.fg};will-change:transform;` + (css || '');
        core.textContent = str;
        mask.appendChild(core);
        parent.appendChild(mask);
        return core;
      },
      // 숫자 + 작은 단위. 돌려주는 값: [알맹이, 숫자 칸] — 숫자 칸의 글자는 d.set으로 바꿉니다
      figure(parent, unit, x, y, px, css, align) {
        const core = d.text(parent, '', x, y, px, 'font-variant-numeric:tabular-nums;' + (css || ''), align), num = document.createElement('span'), tail = document.createElement('span');
        tail.style.cssText = 'font-size:.54em;font-weight:500;letter-spacing:0;margin-left:.1em;';
        tail.textContent = unit;
        core.appendChild(num);
        core.appendChild(tail);
        return [core, num];
      },
      // 작은 라벨 (모노 글꼴, 대문자, 자간 넓게)
      label(parent, str, x, y, align, alpha) {
        return d.text(parent, str, x, y, u * 0.026, `font-family:${d.mono};letter-spacing:.12em;text-transform:uppercase;opacity:${alpha === undefined ? 1 : alpha};`, align);
      },
      // 글자가 달라졌을 때만 바꿔 씀
      set(el, str) { if (el.textContent !== str) el.textContent = str; },
      // 알맹이를 가림막 안에서 움직임: a = 들어오는 진행(0~1, 아래에서 올라옴), b = 나가는 진행(0~1, 위로 빠짐)
      slide(core, a, b) { core.style.transform = `translate3d(0,${(1 - kit.expo(a)) * 118 - kit.into(b || 0) * 118}%,0)`; },
      // 가는 줄: 가로(왼쪽에서 자람) 또는 세로(위에서 자람). transform의 scaleX·scaleY로 늘립니다
      rule(parent, x, y, len, alpha, color, upright) {
        return d.box(parent, x, y, upright ? d.hair : len, upright ? len : d.hair, `background:${color || api.fg};opacity:${alpha};transform-origin:0 0;`);
      },
      // 화면 전체를 덮는 SVG 판
      svg(parent) {
        const s = document.createElementNS(NS, 'svg');
        s.setAttribute('viewBox', `0 0 ${W} ${H}`);
        s.style.cssText = 'position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;';
        parent.appendChild(s);
        return s;
      },
      // SVG 도형 하나: d.shape(svg, 'path', { d: '…', stroke: '…' })
      shape(svg, tag, attrs) {
        const el = document.createElementNS(NS, tag);
        for (const key in attrs) el.setAttribute(key, attrs[key]);
        svg.appendChild(el);
        return el;
      },
      // 선의 from~to 구간만 보이게 (0 = 선의 처음, 1 = 끝). 선에 pathLength="1"을 줘야 합니다
      draw(el, from, to) {
        const len = Math.max(0, to - from);
        el.style.strokeDasharray = len + ' 2';
        el.style.strokeDashoffset = -from;
        el.style.visibility = len > 0.0005 ? 'visible' : 'hidden';
      },
      // 머리글: 맨 위 작은 라벨 둘과 가는 줄. 돌려주는 함수에 (들어옴, 나감) 진행을 넣어 움직입니다
      head(left, right) {
        const a = d.label(api.root, left, d.mx, d.my), b = d.label(api.root, right, W - d.mx, d.my, 'right', 0.55), line = d.rule(api.root, d.mx, d.my + u * 0.054, W - d.mx * 2, 0.22);
        return (p, out) => {
          d.slide(a, p, out);
          d.slide(b, p, out);
          line.style.transform = `scaleX(${kit.expo(p) * (1 - kit.into(out || 0))})`;
        };
      }
    };
    return d;
  }
  function flowChart(api) {
    const TITLE = '요청 하나가 서버 안에서';                           // 제목
    const NODES = [                                            // 상자: [이름, 순서(0부터), 갈래(0 = 가운데, -1·1 = 양옆)]
      ['로그인 없는 요청', 0, 0], ['메모리 부족 일으키기', 1, 0], ['뒷정리 실패', 2, -1], ['정상 뒷정리', 2, 1], ['남의 메모리 읽고 명령', 3, -1], ['응답 끝', 3, 1]
    ];
    const LINKS = [[0, 1], [1, 2], [1, 3], [2, 4], [3, 5], [4, 5]];   // 화살표: [어디서, 어디로] (NODES 번호)
    const PATH = [0, 1, 2, 4, 5];                                    // 마지막에 강조할 길 (NODES 번호를 지나가는 순서대로)
    const LOOP = 8.6;                                                // 한 바퀴 길이(초)
    const d = chartKit(api), kit = d.kit, u = d.u, W = d.W, H = d.H, root = api.root;
    const flat = d.wide, count = Math.max.apply(null, NODES.map(n => n[1])) + 1;   // 가로 화면은 왼쪽→오른쪽, 그 밖에는 위→아래로 흐름
    const bw = flat ? Math.min(u * 0.3, (W - d.mx * 2) / count * 0.8) : u * 0.36, bh = u * (flat ? 0.13 : d.tall ? 0.095 : 0.075);
    const m0 = flat ? d.mx + bw / 2 : d.my + u * (d.tall ? 0.3 : 0.215) + bh / 2, m1 = flat ? W - d.mx - bw / 2 : H - d.my - bh / 2 - u * 0.01;
    const mid = flat ? d.my + u * 0.16 + (H - d.my * 2 - u * 0.16) / 2 : W / 2, off = flat ? u * 0.2 : Math.min(u * 0.22, (W - d.mx * 2 - bw) / 2);
    const head = d.head('FLOW', String(NODES.length).padStart(2, '0') + ' STEPS');
    const title = d.text(root, TITLE, d.mx, d.my + u * 0.088, u * 0.056, 'font-weight:600;letter-spacing:-.03em;');
    const svg = d.svg(root), T = n => 0.6 + n[1] * 0.6, HOT = 4.6, fs = u * (flat ? 0.037 : 0.032);   // T = 상자가 뜨는 때, HOT = 강조가 시작되는 때(초)
    const nodes = NODES.map((n, i) => {
      const m = m0 + (m1 - m0) * n[1] / (count - 1), c = mid + n[2] * off, p = flat ? [m, c] : [c, m], order = PATH.indexOf(i);
      const edge = `left:${p[0] - bw / 2}px;top:${p[1] - bh / 2}px;width:${bw}px;height:${bh}px;box-sizing:border-box;`;
      return {
        p: p, at: T(n), order: order,
        frame: d.box(root, 0, 0, 0, 0, edge + `border:${d.hair}px solid ${d.tint(api.fg, 0.55)};`),
        glow: order < 0 ? null : d.box(root, 0, 0, 0, 0, edge + `border:${d.hair * 2.2}px solid ${d.hot};background:${d.tint(d.hot, 0.1)};`),
        name: d.text(root, n[0], p[0], p[1] - fs * 0.6, fs, 'font-weight:600;letter-spacing:-.02em;', 'center'),
        id: d.label(root, String(i + 1).padStart(2, '0'), p[0] - bw / 2, p[1] - bh / 2 - u * 0.038, 'left', 0.45)
      };
    });
    const links = LINKS.map(l => {
      const a = nodes[l[0]].p, b = nodes[l[1]].p, gap = u * 0.012, k = u * 0.013;
      // 시작 = 상자의 나가는 쪽 가장자리, 끝 = 들어가는 쪽 가장자리 바로 앞. 갈래가 다르면 가운데에서 한 번 꺾음
      const s = flat ? [a[0] + bw / 2, a[1]] : [a[0], a[1] + bh / 2], e = flat ? [b[0] - bw / 2 - gap, b[1]] : [b[0], b[1] - bh / 2 - gap];
      const turn = flat ? (s[0] + e[0]) / 2 : (s[1] + e[1]) / 2;
      const path = flat ? `M${s[0]} ${s[1]}H${turn}V${e[1]}H${e[0]}` : `M${s[0]} ${s[1]}V${turn}H${e[0]}V${e[1]}`;
      const tip = flat ? `M${e[0] - k} ${e[1] - k * 0.7}L${e[0]} ${e[1]}L${e[0] - k} ${e[1] + k * 0.7}` : `M${e[0] - k * 0.7} ${e[1] - k}L${e[0]} ${e[1]}L${e[0] + k * 0.7} ${e[1] - k}`;
      const order = PATH.findIndex((n, j) => n === l[0] && PATH[j + 1] === l[1]);
      const pen = (dd, color, w) => d.shape(svg, 'path', { d: dd, fill: 'none', stroke: color, 'stroke-width': w, 'stroke-linejoin': 'round', 'stroke-linecap': 'round', pathLength: 1 });
      return {
        from: nodes[l[0]].at, to: nodes[l[1]].at, order: order,
        line: pen(path, d.tint(api.fg, 0.55), d.hair), tip: pen(tip, d.tint(api.fg, 0.55), d.hair),
        hot: order < 0 ? null : [pen(path, d.hot, d.hair * 2.2), pen(tip, d.hot, d.hair * 2.2)]
      };
    });
    const clip = (el, a, b) => { el.style.clipPath = flat ? `inset(0 ${(1 - a) * 100}% 0 ${b * 100}%)` : `inset(${b * 100}% 0 ${(1 - a) * 100}% 0)`; };   // 흐르는 방향으로 드러나고, 같은 방향으로 사라짐
    return time => {
      const t = time % LOOP, out = kit.seg(t, LOOP - 0.9, LOOP - 0.15), wipe = kit.io(out);
      const dim = 1 - 0.65 * kit.seg(t, HOT - 0.1, HOT + 0.5) * (1 - out);   // 강조가 시작되면 길 밖의 것들은 흐려짐
      head(kit.seg(t, 0, 0.8), out);
      d.slide(title, kit.seg(t, 0.1, 0.9), out);
      nodes.forEach(n => {
        clip(n.frame, kit.expo(kit.seg(t, n.at, n.at + 0.7)), wipe);
        d.slide(n.name, kit.seg(t, n.at + 0.1, n.at + 0.85), out);
        d.slide(n.id, kit.seg(t, n.at + 0.18, n.at + 0.9), out);
        if (n.glow) clip(n.glow, kit.expo(kit.seg(t, HOT + n.order * 0.4, HOT + n.order * 0.4 + 0.55)), wipe);
        else n.frame.style.opacity = n.name.style.opacity = dim;
      });
      links.forEach(l => {
        const q = kit.io(kit.seg(t, l.from + 0.3, l.to + 0.1));
        d.draw(l.line, wipe, q);
        d.draw(l.tip, wipe, kit.seg(q, 0.9, 1));
        l.line.style.opacity = l.tip.style.opacity = l.hot ? 1 : dim;
        if (l.hot) {
          const h = kit.io(kit.seg(t, HOT + l.order * 0.4 + 0.2, HOT + (l.order + 1) * 0.4 + 0.1));
          d.draw(l.hot[0], wipe, h);
          d.draw(l.hot[1], wipe, kit.seg(h, 0.9, 1));
        }
      });
    };
  }

  // ③ 공통 엔진: 고칠 필요 없습니다
  function qmEngine(root, CFG, motion) {
    // 색 8개: 가장 밝은 색 → 가장 진한 색. [0] 흰 판·밝은 글자, [1]~[4] 연한 색에서 중간 색, [5] 포인트 색, [6] 둘째 포인트 색, [7] 글자색
    // 바꾸려면 CONFIG에 colors: ['#...', ...] 를 같은 순서로 넣으면 됩니다. 비워 두면 흰색·네이비 계열이 쓰입니다
    const COLORS = CFG.colors || ['#ffffff', '#e8ecf3', '#cfd7e6', '#9aa8c4', '#5c7099', '#1f3460', '#6e1a2f', '#15171c'];
    // 매번 같은 순서가 나오는 난수 (같은 seed면 같은 결과)
    const rand = seed => () => (seed = (seed * 1664525 + 1013904223) % 4294967296) / 4294967296;
    // 샘플 그림: CONFIG.images가 비어 있을 때 쓰입니다. 어느 카드에 어떤 그림이 갈지는 열 때마다 섞입니다
    const dice = rand(CFG.seed || Math.floor(Math.random() * 1e9) + 1);
    const shift = Math.floor(dice() * 16);
    // 내 이미지: 칸마다 하나씩(빈 칸은 null → 그 칸은 샘플 그림). 칸보다 장면의 그림 자리가 많으면 돌아가며 씀
    const IMGS = (CFG.images || []).slice();
    const NIMG = IMGS.some(Boolean) ? IMGS.length : 0;
    const used = new Set(), usedArt = new Set();     // 장면이 몇 번째 그림까지 쓰는지 (사이트가 사진 칸 수를 정할 때 읽음)
    const FONT = '"Pretendard Variable","Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif';
    // 색의 밝기 (0 = 검정, 255 = 흰색). #rrggbb 꼴이 아니면 검정으로 봅니다
    // 투명 배경 위에 다른 배경을 깔 때(CONFIG.under = 그 배경의 대표 색)는 그 색을 바탕으로 보고 글자색을 고릅니다
    const light = color => color === 'transparent' && /^#[0-9a-f]{6}$/i.test(CFG.under || '') ? light(CFG.under) : /^#[0-9a-f]{6}$/i.test(color) ? (parseInt(color.slice(1, 3), 16) * 299 + parseInt(color.slice(3, 5), 16) * 587 + parseInt(color.slice(5, 7), 16) * 114) / 1000 : 0;
    const bright = light(CFG.bg);
    const still = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    let frame = null, time = CFG.startAt || (still ? 4 : 0), last = 0, raf = 0, timer = 0, size = '';
    let playing = false, seen = true, want = CFG.autoplay !== false && !still, drew = false;
    // 랜딩페이지용: 실제 마우스·스크롤에 반응합니다 (CONFIG.live). true = 페이지에 붙여 쓸 때, 'try' = 미리보기 창(마우스가 없으면 연출대로)
    const LIVE = CFG.live === true || CFG.live === 'try', TRY = CFG.live === 'try';
    const live = { x: 0, y: 0, tx: 0, ty: 0, over: 0, on: false, down: 0, press: false, s: 0, ts: 0, ready: false };
  
    const api = {
      root: root,
      bg: CFG.bg,
      clear: CFG.bg === 'transparent',              // 투명 배경으로 그리는 중 (영상 편집기에 얹을 자막 등). 이때는 화면 전체를 칠하는 바탕을 그리지 않습니다
      fg: bright > 150 ? COLORS[7] : COLORS[0],     // 배경 위에 바로 쓰는 글자색
      ink: COLORS[7],                               // 흰 판 위에 쓰는 글자색
      colors: COLORS.slice(),                       // 색 8개 그대로 (배경 모션이 그라데이션 재료로 씀)
      accent: COLORS[5],                            // 포인트 색
      deep: COLORS[6],                              // 둘째 포인트 색
      on: color => light(color) > 150 ? COLORS[7] : '#ffffff',   // 그 색 위에 올릴 글자색 (밝은 색 위엔 진한 글자, 진한 색 위엔 흰 글자)
      tone: i => COLORS[1 + (i % 5 + 5) % 5],       // i번째 변주 색 (연한 색 ~ 포인트 색)
      rand: rand,
      font: FONT,
      ko: text => /[\u3131-\u318e\uac00-\ud7a3]/.test(text),   // 한글이 들어 있나 (한글이 든 글줄은 한글 글꼴 하나로 씁니다)
      count: NIMG,                                  // 넣은 이미지 칸 수 (0이면 샘플)
      words: CFG.words || [],                       // 넣은 낱말 (글자 모션에서 사용, 비면 기본 낱말)
      live: LIVE && !TRY,                           // 실제 페이지에서 마우스·스크롤에 반응하는 중 (미리보기 칸·영상 저장 때는 false)
      // 발표(모션 PPT)에서 '다음 효과'를 누른 단계 { step, at }: 발표기가 채워 줌. 없으면 null (미리보기·영상은 시간표대로)
      cue: CFG.cue || null,
      page: CFG.page || 0,                          // 모션 PPT에서 몇 번째 장인지 (발표기가 채워 줌, 없으면 0)
      // 마우스 자리 { x, y: 무대 안의 px, down: 누름 0~1, on: 마우스가 와 있는 정도 0~1, fake: 연출용 가짜 커서를 보일 정도 0~1 }
      // demo: 미리보기·영상 저장 때 쓸 연출 자리 { x, y, down, on } (t로 계산해서 넘김). 실제 페이지에서는 진짜 마우스를 따라갑니다
      pointer(demo) {
        const d = Object.assign({ x: api.W / 2, y: api.H / 2, down: 0, on: 1 }, demo || {});
        if (!LIVE) return { x: d.x, y: d.y, down: d.down, on: d.on, fake: 1 };
        if (!live.ready) return TRY ? { x: d.x, y: d.y, down: d.down, on: d.on, fake: 1 } : { x: d.x, y: d.y, down: 0, on: 0, fake: 0 };
        const k = TRY ? live.over : 1, mix = (a, b) => a + (b - a) * k;
        return { x: mix(d.x, live.x), y: mix(d.y, live.y), down: mix(d.down, live.down), on: TRY ? mix(d.on, live.over) : live.over, fake: 1 - k };
      },
      // 스크롤 진행 0~1. 미리보기·영상 저장 때는 demo(t로 계산한 값), 실제 페이지에서는 이 상자(또는 CONFIG.track의 칸)가 화면을 지나는 정도
      scroll: demo => LIVE && !TRY ? live.s : demo,
      image: i => { used.add(i); if (!NIMG) return null; const u = IMGS[i % NIMG]; if (u) return u; const a = api.art(i, true); return a ? a.url : null; },   // i번째 이미지 주소 (없으면 null, 빈 칸이면 샘플 그림)
      // i번째 샘플 그림 { cv, url }. 코드에 qmArt가 함께 들어 있을 때만 나옵니다 (plain: 글자 없는 그림만)
      art: (i, plain) => { drew = true; usedArt.add(i); return typeof qmArt === 'function' ? qmArt(plain ? i : i + shift, plain) : null; },
      // i번째 그림을 CSS background 값으로: 내 이미지가 있으면 이미지, 없으면 샘플 그림
      paint: i => {
        used.add(i);
        const u = NIMG ? IMGS[i % NIMG] : null, a = u ? null : api.art(i, NIMG > 0);   // 내 사진 사이의 빈 칸은 글자 없는 샘플 사진으로
        return u ? `url("${u}") center / cover no-repeat, #1c1c1e` : a ? `url(${a.url}) center / cover no-repeat` : `linear-gradient(145deg, ${COLORS[2]}, ${COLORS[5]})`;
      },
      // 숏폼 자막용 미리보기 바탕: 영상 대신 깔아 두는 흐릿한 장면 (내 이미지를 넣으면 그 그림). 투명 배경일 때는 그리지 않고 null을 돌려줍니다
      footage(dim) {
        if (api.clear) return null;
        used.add(0);
        const el = document.createElement('div'), n = IMGS[0] ? 1 : 0;
        el.style.cssText = 'position:absolute;left:0;top:0;width:100%;height:100%;filter:brightness(' + (dim == null ? 0.85 : dim) + ');background:' + (n ? `url("${IMGS[0]}") center / cover no-repeat` :
          'radial-gradient(55% 32% at 28% 26%, rgba(243,237,226,.5), rgba(243,237,226,0) 70%), radial-gradient(45% 30% at 78% 52%, rgba(154,120,110,.45), rgba(154,120,110,0) 70%), ' +
          'radial-gradient(80% 45% at 50% 108%, rgba(31,52,96,.75), rgba(31,52,96,0) 72%), radial-gradient(40% 25% at 18% 70%, rgba(205,196,184,.28), rgba(205,196,184,0) 70%), linear-gradient(172deg, #4a4f5a, #23262d 60%, #15171c)') + ';';
        root.appendChild(el);
        return el;
      },
      // 0~1 사이 값을 부드럽게 (천천히 출발, 천천히 도착)
      ease: x => { x = Math.max(0, Math.min(1, x)); return x * x * (3 - 2 * x); },
      // 0~1 사이 값을 통통 튀게 (살짝 넘쳤다가 제자리로)
      spring: x => { x = Math.max(0, Math.min(1, x)) - 1; return 1 + 2.70158 * x * x * x + 1.70158 * x * x; },
      // 화면 한가운데가 (0,0,0)인 3D 공간. 숫자가 작을수록 원근감이 세집니다
      space(perspective) {
        root.style.perspective = perspective ? perspective + 'px' : 'none';
        return api.group(root, 'left:50%;top:50%;');
      },
      // 여러 조각을 한꺼번에 돌리거나 옮길 묶음
      group(parent, extra) {
        const el = document.createElement('div');
        el.style.cssText = 'position:absolute;left:0;top:0;width:0;height:0;transform-style:preserve-3d;' + (extra || '');
        parent.appendChild(el);
        return el;
      },
      // 빈 상자 하나. 상자의 중심이 (0,0)에 놓입니다 (UI 모션에서 사용)
      box(parent, w, h, css) {
        const el = document.createElement('div');
        el.style.cssText = `position:absolute;left:0;top:0;box-sizing:border-box;width:${w}px;height:${h}px;margin:${-h / 2}px 0 0 ${-w / 2}px;font-family:${FONT};` + (css || '');
        parent.appendChild(el);
        return el;
      },
      // 카드 한 장. 카드의 중심이 (0,0)에 놓입니다 (카드 모션에서 사용)
      card(parent, i, w, h, twoSided) {
        const el = api.box(parent, w, h, 'overflow:hidden;'), s = el.style;
        s.borderRadius = Math.min(w, h) * (CFG.radius || 0) + 'px';
        s.backfaceVisibility = s.webkitBackfaceVisibility = twoSided ? 'visible' : 'hidden';
        s.background = api.paint(i);
        return el;
      }
    };
  
    function build() {
      const W = root.clientWidth, H = root.clientHeight;
      if (!W || !H || size === W + 'x' + H) return;
      size = W + 'x' + H;
      if (frame && frame.dispose) frame.dispose();   // WebGL 모션은 다시 만들기 전에 정리
      root.textContent = '';
      api.W = W; api.H = H; api.u = Math.min(W, H);
      if (LIVE && !TRY) { measure(); live.s = live.ts; }
      frame = motion(api);
      frame(time);
      runs(root);
      if (watch) watch.takeRecords();   // 방금 만든 장면은 위에서 다 봤으니 쌓인 기록은 버림
    }
    // 한 글줄 안에 한글과 영문·숫자가 섞였는데 영문 전용 글꼴(Anton·Inter 등)이 앞에 서 있으면,
    // 그 글줄은 글꼴 목록 뒤쪽의 한글 글꼴로 통째로 씁니다 (영문 글꼴과 한글 글꼴이 한 줄에서 따로 놀지 않게)
    const LATIN = /^(Anton|Archivo|Instrument Serif|Inter|JetBrains Mono)$/i;
    function runs(top) {
      const walk = document.createTreeWalker(top, NodeFilter.SHOW_TEXT), seen = new Set();
      for (let n = walk.nextNode(); n; n = walk.nextNode()) if (n.parentElement) seen.add(n.parentElement);
      seen.forEach(el => {
        let own = '';
        el.childNodes.forEach(c => { if (c.nodeType === 3) own += c.nodeValue; });
        if (!/[\u3131-\u318e\uac00-\ud7a3]/.test(own) || !/[A-Za-z0-9]/.test(own)) return;
        const list = getComputedStyle(el).fontFamily.split(',').map(f => f.trim().replace(/^["']|["']$/g, ''));
        if (!LATIN.test(list[0])) return;
        el.style.fontFamily = list.filter(f => !LATIN.test(f)).map(f => /^[a-z-]+$/.test(f) ? f : '"' + f + '"').join(',');
      });
    }
    // 장면이 글자를 바꾸면 바뀐 곳만 다시 봅니다
    const watch = window.MutationObserver ? new MutationObserver(list => mend(list)) : null;
    const mend = list => list.forEach(r => { const el = r.target.nodeType === 3 ? r.target.parentElement : r.target; if (el && root.contains(el)) runs(el); });
    if (watch) watch.observe(root, { childList: true, characterData: true, subtree: true });
    function tick(now) {
      raf = requestAnimationFrame(tick);
      const dt = Math.max(0, Math.min((now - last) / 1000, 0.1));
      time += dt * CFG.speed;                       // 흐른 시간만큼 (뒤로 가지 않게)
      if (CFG.once && time > CFG.once) time = CFG.once;   // 한 번만: 화면에 들어오면 한 번 재생하고 이 초의 장면에서 멈춤
      last = now;
      if (LIVE) follow(dt);
      if (frame) frame(time);
    }
    // 스크롤 진행: CONFIG.track이 있으면 그 칸(키 큰 칸 안에 이 상자를 position:sticky로 넣은 경우)을 다 내려가는 정도, 없으면 이 상자가 화면 아래에서 위로 지나가는 정도
    function measure() {
      const el = CFG.track ? document.querySelector(CFG.track) : root;
      if (!el) return;
      const r = el.getBoundingClientRect(), vh = window.innerHeight || 1;
      live.ts = Math.max(0, Math.min(1, CFG.track ? -r.top / Math.max(1, r.height - vh) : (vh - r.top) / (vh + r.height)));
    }
    // 진짜 마우스·스크롤 값을 부드럽게 따라감
    function follow(dt) {
      const k = 1 - Math.exp(-dt * 14);
      live.x += (live.tx - live.x) * k;
      live.y += (live.ty - live.y) * k;
      live.over += ((live.on ? 1 : 0) - live.over) * (1 - Math.exp(-dt * 6));
      live.down += ((live.press ? 1 : 0) - live.down) * (1 - Math.exp(-dt * 18));
      if (!TRY) { measure(); live.s += (live.ts - live.s) * (1 - Math.exp(-dt * 10)); }
    }
    const spot = e => {
      const r = root.getBoundingClientRect();
      live.tx = (e.clientX - r.left) * root.clientWidth / (r.width || 1);
      live.ty = (e.clientY - r.top) * root.clientHeight / (r.height || 1);
      if (!live.ready) { live.x = live.tx; live.y = live.ty; live.ready = true; }
    };
    // 멈춰 있을 때(일시 정지·동작 줄이기 설정)도 마우스에는 바로 반응
    const poke = () => { if (playing || !frame) return; live.x = live.tx; live.y = live.ty; live.over = live.on ? 1 : 0; live.down = live.press ? 1 : 0; frame(time); };
    const hands = {
      pointerenter: e => { spot(e); live.on = true; poke(); },
      pointermove: e => { spot(e); live.on = true; poke(); },
      pointerleave: () => { live.on = false; live.press = false; poke(); },
      pointerdown: e => { spot(e); live.on = live.press = true; poke(); },
      pointerup: () => { live.press = false; poke(); }
    };
    if (LIVE) Object.keys(hands).forEach(k => root.addEventListener(k, hands[k]));
    // 화면에 보일 때만 움직입니다
    function sync() {
      const on = want && seen;
      if (on && !playing) { playing = true; last = performance.now(); raf = requestAnimationFrame(tick); }
      if (!on && playing) { playing = false; cancelAnimationFrame(raf); }
    }
  
    Object.assign(root.style, { position: 'relative', overflow: 'hidden', background: CFG.bg, aspectRatio: CFG.ratio });
    build();
    const ro = new ResizeObserver(() => { clearTimeout(timer); timer = setTimeout(build, 100); });
    const io = new IntersectionObserver(e => { seen = e[e.length - 1].isIntersecting; sync(); });
    // 웹폰트로 그리는 모션은 폰트가 도착하면 크기를 다시 재서 그립니다
    const refit = () => { if (frame && (frame.fonts || drew)) { size = ''; build(); } };
    if (document.fonts && document.fonts.addEventListener) document.fonts.addEventListener('loadingdone', refit);
    ro.observe(root);
    io.observe(root);
    sync();
  
    return {
      play() { want = true; sync(); },
      pause() { want = false; sync(); },
      restart() { time = 0; if (frame) frame(time); },
      seek(t) { time = t; if (frame) frame(time); if (watch) mend(watch.takeRecords()); },
      now() { return time; },                       // 지금 몇 초의 장면인지 (발표기에서 씀)
      motion() { return frame; },                   // 모션이 돌려준 장면 함수 (frame.steps 같은 정보를 읽을 때)   // t초의 장면으로 건너뜀 (영상으로 한 장씩 찍을 때)
      slots() { return used.size || usedArt.size; },   // 이 장면이 쓰는 그림 칸 수 (사이트의 '내 사진' 칸)
      destroy() { want = false; sync(); if (LIVE) Object.keys(hands).forEach(k => root.removeEventListener(k, hands[k])); ro.disconnect(); io.disconnect(); if (watch) watch.disconnect(); clearTimeout(timer); if (document.fonts && document.fonts.removeEventListener) document.fonts.removeEventListener('loadingdone', refit); if (frame && frame.dispose) frame.dispose(); root.textContent = ''; }
    };
  }

  qmEngine(document.getElementById('qm-flow-chart'), CONFIG, flowChart);
})();
</script>
</body>
