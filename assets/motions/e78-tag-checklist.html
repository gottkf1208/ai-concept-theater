<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>준비물 태그</title>
<style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#ddd6c8}</style>
</head>
<body>
<!-- 쿼카 모션랩 · 준비물 태그 (Tag Checklist) -->
<!-- 글꼴: 마루 부리 (OFL (네이버)) · 프리텐다드 (OFL) · 눈누(noonnu.cc)의 무료 한글 글꼴 -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=Noto+Sans+KR:wght@100..900&family=Instrument+Serif:ital@0;1&family=Noto+Serif+KR:wght@200..900&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
@font-face{font-family:'MaruBuri';font-style:normal;font-weight:200;font-display:swap;src:url(https://hangeul.pstatic.net/hangeul_static/webfont/MaruBuri/MaruBuri-ExtraLight.woff2) format('woff2')}@font-face{font-family:'MaruBuri';font-style:normal;font-weight:300;font-display:swap;src:url(https://hangeul.pstatic.net/hangeul_static/webfont/MaruBuri/MaruBuri-Light.woff2) format('woff2')}@font-face{font-family:'MaruBuri';font-style:normal;font-weight:400;font-display:swap;src:url(https://hangeul.pstatic.net/hangeul_static/webfont/MaruBuri/MaruBuri-Regular.woff2) format('woff2')}@font-face{font-family:'MaruBuri';font-style:normal;font-weight:600;font-display:swap;src:url(https://hangeul.pstatic.net/hangeul_static/webfont/MaruBuri/MaruBuri-SemiBold.woff2) format('woff2')}@font-face{font-family:'MaruBuri';font-style:normal;font-weight:700;font-display:swap;src:url(https://hangeul.pstatic.net/hangeul_static/webfont/MaruBuri/MaruBuri-Bold.woff2) format('woff2')}
</style>
<div id="qm-tag-checklist" style="width:100%;max-width:calc(100vh * 1)"></div>
<script>
(function () {
  // ① 설정: 여기만 고치면 됩니다
  const CONFIG = {
    speed: 1,          // 속도 (1 = 기본, 2 = 두 배)
    bg: '#ddd6c8',     // 배경색 ('transparent'로 바꾸면 투명)
    colors: ['#fbf9f4', '#f6f3ec', '#efeade', '#e4ddd0', '#a59c8d', '#2563EB', '#1f3460', '#22201d'],   // 색 8개: 밝은 색 → 진한 색 ([5] 포인트 색, [7] 글자색)
    ratio: '1 / 1'     // 화면 비율 (가로 / 세로)
  };

  // ② 모션: 준비물 태그
  function qmKit(api) {
    const clamp = x => Math.max(0, Math.min(1, x));
    const kit = {
      sans: '"Pretendard Variable","Pretendard","Noto Sans KR",' + api.font,    // 기본 글꼴: 프리텐다드 하나로 한글·영문을 함께 (한 줄 안에서 글꼴이 섞이지 않게)
      serif: '"Instrument Serif","MaruBuri","Noto Serif KR","Times New Roman",serif',     // 강조 한마디에 쓰는 세리프 (영문은 기울임과 잘 어울리는 Instrument Serif, 한글이 섞인 글줄은 마루 부리 하나로)
      mono: '"JetBrains Mono","Pretendard Variable",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace',   // 작은 라벨·숫자 (한글이 섞인 라벨은 프리텐다드 하나로)
      clamp: clamp,
      seg: (t, a, b) => clamp((t - a) / (b - a)),                 // t가 a~b 사이 어디쯤인지 0~1로
      mix: (a, b, p) => a + (b - a) * p,
      out: x => 1 - Math.pow(1 - clamp(x), 4),                    // 빠르게 출발해 부드럽게 멈춤 (cubic-bezier(.22,1,.36,1)과 비슷)
      expo: x => { x = clamp(x); return x >= 1 ? 1 : 1 - Math.pow(2, -10 * x); },   // 더 급하게 출발해 길게 멈춤 (cubic-bezier(.16,1,.3,1)과 비슷)
      into: x => Math.pow(clamp(x), 3),                           // 천천히 출발해 빠르게 빠져나감
      io: x => { x = clamp(x); return x < 0.5 ? 8 * x * x * x * x : 1 - Math.pow(-2 * x + 2, 4) / 2; },   // 천천히-빠르게-천천히 (cubic-bezier(.76,0,.24,1)과 비슷)
      // 글자를 쪼개 parent에 넣음. by: 'line'(줄바꿈 \n 기준) | 'word' | 'char'
      // 조각마다 가림막(overflow:hidden) 하나와 그 안에서 움직일 알맹이 하나가 생깁니다. 돌려주는 값: 알맹이 목록
      split(parent, text, by) {
        const units = by === 'line' ? String(text).split('\n') : by === 'word' ? String(text).split(/(\s+)/) : Array.from(String(text));
        const parts = [];
        units.forEach(unit => {
          if (!unit) return;
          if (by !== 'line' && /^\s+$/.test(unit)) { parent.appendChild(document.createTextNode(unit.indexOf('\n') >= 0 ? '\n' : ' ')); return; }
          const mask = document.createElement('span'), core = document.createElement('span');
          // 가림막은 위아래로 조금 넉넉하게 (받침·꼬리가 잘리지 않게), 그만큼 바깥 여백을 당겨 줄 간격은 그대로 둠
          mask.style.cssText = `display:${by === 'line' ? 'block' : 'inline-block'};overflow:hidden;vertical-align:top;padding:.14em 0;margin:-.14em 0;` + (by === 'line' ? '' : 'white-space:pre;');
          core.style.cssText = `display:${by === 'line' ? 'block' : 'inline-block'};will-change:transform;`;
          core.textContent = unit;
          mask.appendChild(core);
          parent.appendChild(mask);
          parts.push(core);
        });
        return parts;
      },
      // 조각들이 차례로 아래에서 올라옴: p는 전체 진행 0~1, gap은 조각 사이 시차(전체의 몇 분의 일), 올라온 뒤 그대로 있음
      rise(parts, p, gap) {
        const each = 1 - (gap || 0.5), n = Math.max(1, parts.length - 1);
        parts.forEach((el, i) => {
          const q = kit.expo(kit.seg(p, (i / n) * (1 - each), (i / n) * (1 - each) + each));
          el.style.transform = `translate3d(0,${(1 - q) * 108}%,0)`;
        });
      },
      // 작은 라벨 (대문자, 자간 넓게)
      label(parent, text, px, color) {
        const el = document.createElement('span');
        el.textContent = text;
        el.style.cssText = `display:block;font:500 ${px}px/1.2 ${kit.mono};letter-spacing:.12em;text-transform:uppercase;color:${color || api.fg};white-space:nowrap;`;
        parent.appendChild(el);
        return el;
      }
    };
    return kit;
  }

  function ppKit(api) {
    const NS = 'http://www.w3.org/2000/svg', u = api.u;
    const clamp = x => Math.max(0, Math.min(1, x));
    const dark = api.fg !== api.ink;   // 어두운 책상 위인지
    const pp = {
      hair: Math.max(1, Math.round(u / 560)),          // 가장 가는 선의 굵기
      nib: Math.max(1.3, u * 0.0052),                  // 펜 선의 굵기
      cell: Math.max(6, Math.round(u * 0.027)),        // 모눈 한 칸 (종이의 5mm에 해당)
      paper: api.tone(0),                              // 종이색
      pen: api.deep,                                   // 펜 색 (블루블랙 잉크)
      // 색에 투명도 주기: '#rrggbb' → 'rgba(r,g,b,투명도)'
      a(color, alpha) { if (!/^#[0-9a-f]{6}$/i.test(color)) return color; const n = parseInt(color.slice(1), 16); return `rgba(${n >> 16},${n >> 8 & 255},${n & 255},${alpha})`; },
      // 빈 조각 하나 (부모 상자의 왼쪽 위가 기준). text를 주면 글자가 들어갑니다
      el(parent, css, text) {
        const el = document.createElement('div');
        el.style.cssText = 'position:absolute;box-sizing:border-box;' + (css || '');
        if (text != null) el.textContent = text;
        parent.appendChild(el);
        return el;
      },
      // 모눈 무늬 (CSS background 값). dots가 참이면 선 대신 점
      grid(size, color, dots) {
        const h = pp.hair;
        return dots
          ? `radial-gradient(circle at ${h}px ${h}px, ${color} ${h * 0.8}px, transparent ${h * 0.8 + 0.5}px) ${-h}px ${-h}px / ${size}px ${size}px`
          : `linear-gradient(to right, ${color} ${h}px, transparent ${h}px) 0 0 / ${size}px ${size}px, linear-gradient(to bottom, ${color} ${h}px, transparent ${h}px) 0 0 / ${size}px ${size}px`;
      },
      // 종이 한 장: 직각 모서리, 머리카락 굵기 테두리, 아주 옅은 그림자. 종이의 중심이 (0,0)에 놓입니다
      sheet(parent, w, h, css) {
        return api.box(parent, w, h, `background:${pp.paper};color:${api.ink};box-shadow:0 0 0 ${pp.hair}px ${pp.a(api.ink, dark ? 0 : 0.09)},0 ${u * 0.003}px ${u * 0.008}px rgba(0,0,0,${dark ? 0.3 : 0.05}),0 ${u * 0.02}px ${u * 0.05}px rgba(0,0,0,${dark ? 0.32 : 0.07});` + (css || ''));
      },
      // 종이가 들어오고 나가기: 아래에서 짧게 올라오며 드러나고(pin 0→1), 위로 짧게 올라가며 가려진다(pout 0→1)
      enter(el, pin, pout, x, y, turn) {
        const pad = u * 0.14;
        pout = pout || 0;
        el.style.transform = `translate3d(${x || 0}px,${(y || 0) + ((1 - pin) * 0.07 - pout * 0.05) * u}px,0) rotate(${turn || 0}deg)`;
        el.style.clipPath = `inset(${pout > 0 ? pout * 100 + '%' : -pad + 'px'} ${-pad}px ${pin < 1 ? (1 - pin) * 100 + '%' : -pad + 'px'} ${-pad}px)`;
      },
      // 가로로 긋는 가는 줄 (인쇄된 괘선)
      rule(parent, x, y, w, color, thick) {
        return pp.el(parent, `left:${x}px;top:${y}px;width:${w}px;height:${thick || pp.hair}px;background:${color};transform-origin:0 50%;`);
      },
      // 펜 선을 그릴 판 (부모 상자와 같은 좌표)
      svg(parent, w, h, css) {
        const s = document.createElementNS(NS, 'svg');
        s.setAttribute('viewBox', `0 0 ${w} ${h}`);
        s.style.cssText = `position:absolute;left:0;top:0;width:${w}px;height:${h}px;overflow:visible;pointer-events:none;` + (css || '');
        parent.appendChild(s);
        return s;
      },
      // 펜 선 한 획. 돌려받은 선에 pp.draw(선, 0~1)로 그어진 만큼을 정합니다
      stroke(svg, d, color, width) {
        const p = document.createElementNS(NS, 'path');
        p.setAttribute('d', d);
        p.setAttribute('pathLength', 1);
        p.style.cssText = `fill:none;stroke:${color || pp.pen};stroke-width:${width || pp.nib}px;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1 1;`;
        svg.appendChild(p);
        return p;
      },
      // 선을 p만큼 긋는다 (0 = 아직 안 그음, 1 = 다 그음). off를 주면 처음부터 그만큼 다시 걷어 낸다
      draw(path, p, off) {
        p = clamp(p); off = clamp(off || 0);
        path.style.strokeDashoffset = 1 - p - off;
        path.style.visibility = p > 0.002 && off < 0.998 ? 'visible' : 'hidden';
      },
      // 점들을 부드럽게 잇는 곡선 (path의 d 값)
      curve(pts) {
        const f = v => v.toFixed(1);
        let d = `M${f(pts[0][0])} ${f(pts[0][1])}`;
        for (let i = 0; i < pts.length - 1; i++) {
          const a = pts[Math.max(0, i - 1)], b = pts[i], c = pts[i + 1], e = pts[Math.min(pts.length - 1, i + 2)];
          d += ` C${f(b[0] + (c[0] - a[0]) / 6)} ${f(b[1] + (c[1] - a[1]) / 6)} ${f(c[0] - (e[0] - b[0]) / 6)} ${f(c[1] - (e[1] - b[1]) / 6)} ${f(c[0])} ${f(c[1])}`;
        }
        return d;
      },
      // 손으로 그린 동그라미: 한 바퀴를 조금 넘겨 끝이 겹치게 (seed를 바꾸면 모양이 조금 달라짐)
      loop(cx, cy, rx, ry, seed) {
        const r = api.rand(seed || 7), pts = [], N = 14, a0 = -2.3 + r() * 0.5;
        for (let i = 0; i <= N; i++) {
          const f = i / N, a = a0 + f * Math.PI * 2 * 1.14, k = 1.06 - f * 0.12 + (r() - 0.5) * 0.05;
          pts.push([cx + Math.cos(a) * rx * k + f * rx * 0.08, cy + Math.sin(a) * ry * k - f * ry * 0.06]);
        }
        return pp.curve(pts);
      },
      // 손으로 그은 줄: 자를 대지 않아 살짝 흔들리는 선
      hand(x1, y1, x2, y2, seed) {
        const r = api.rand(seed || 3), j = Math.hypot(x2 - x1, y2 - y1) * 0.01 + u * 0.0015, pts = [];
        for (let i = 0; i <= 4; i++) pts.push([x1 + (x2 - x1) * i / 4, y1 + (y2 - y1) * i / 4 + (i % 4 ? (r() - 0.5) * 2 * j : 0)]);
        return pp.curve(pts);
      },
      // 가림막 안에서 올라오는 글 한 줄. 돌려받은 알맹이에 pp.up(알맹이, 0~1)
      slip(parent, css, text) {
        const mask = pp.el(parent, 'overflow:hidden;white-space:nowrap;padding:.18em 0;margin:-.18em 0;' + (css || ''));
        const core = document.createElement('div');
        core.textContent = text;
        core.style.cssText = 'will-change:transform;';
        mask.appendChild(core);
        core.mask = mask;
        return core;
      },
      // 알맹이를 p만큼 올린다 (0 = 아래에 숨음, 1 = 제자리). out을 주면 위로 그만큼 빠져나간다
      up(core, p, out) { core.style.transform = `translate3d(0,${(1 - clamp(p)) * 130 - clamp(out || 0) * 130}%,0)`; },
      // 숫자·낱말 굴리기: 목록을 세로로 쌓아 두고 가림막 안에서 pos번째가 보이게 민다 (pos는 소수도 되고, 끝까지 가면 처음과 이어짐)
      reel(parent, items, lh, css) {
        const mask = pp.el(parent, `overflow:hidden;white-space:nowrap;height:${lh}px;line-height:${lh}px;` + (css || '')), col = document.createElement('div');
        items.concat([items[0]]).forEach(s => { const d = document.createElement('div'); d.textContent = s; d.style.height = lh + 'px'; col.appendChild(d); });
        col.style.willChange = 'transform';
        mask.appendChild(col);
        return { el: mask, set(pos) { col.style.transform = `translate3d(0,${-pos * lh}px,0)`; } };
      }
    };
    return pp;
  }

  function pp3Path(svg, d, color, width, fill) {
    const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    p.setAttribute('d', d);
    p.style.cssText = `fill:${fill || 'none'};stroke:${color || 'none'};stroke-width:${width || 1}px;stroke-linecap:round;stroke-linejoin:round;`;
    svg.appendChild(p);
    return p;
  }
  function tagChecklist(api) {
    const LABEL = 'CHECK LIST', DATE = '10.29 THU';   // 왼쪽 작은 글씨 / 오른쪽 날짜
    const TITLE = '선생님이 할 일';                      // 제목
    const ITEMS = ['학교 홈페이지 PHP 버전 묻기', '워드프레스면 호스팅 패치 확인', '출처 모르는 공격 코드 안 열기', '지식샘터 연수 일정 옮기기', '내 기기 업데이트 미루지 않기'];   // 준비물 (다섯 줄 안팎)
    const DONE = 4;                                     // 위에서부터 몇 개를 체크할지
    const TO = ['TO', '우리 학교 선생님'];                      // 아래 받는 곳: [이름, 값]
    const LOOP = 8.8;   // 한 바퀴 길이(초)
    const kit = qmKit(api), pp = ppKit(api), { u } = api, sp = api.space(0), ink = api.ink, hair = pp.hair, n = ITEMS.length, dark = api.fg !== api.ink;
    const tw = Math.round(u * 0.48), rowH = Math.round(u * 0.066), bodyY = Math.round(u * 0.243), th = bodyY + n * rowH + Math.round(u * 0.092), pad = Math.round(u * 0.048);
    const cut = Math.round(u * 0.07), hx = tw / 2, hy = Math.round(u * 0.068), far = u * 0.34;   // cut: 잘린 모서리, (hx, hy): 구멍 자리
    const wrap = api.box(sp, tw, th, `transform-origin:${hx}px ${hy}px;`);
    pp.el(wrap, `left:0;top:${cut * 0.45}px;width:100%;height:${th - cut * 0.45}px;border-radius:${cut * 0.5}px ${cut * 0.5}px 0 0;box-shadow:0 ${u * 0.003}px ${u * 0.008}px rgba(0,0,0,${dark ? 0.3 : 0.05}),0 ${u * 0.02}px ${u * 0.05}px rgba(0,0,0,${dark ? 0.32 : 0.08});`);
    const tag = pp.el(wrap, `left:0;top:0;width:100%;height:100%;background:${pp.paper};clip-path:polygon(${cut}px 0,${tw - cut}px 0,100% ${cut}px,100% 100%,0 100%,0 ${cut}px);`);
    const sv = pp.svg(wrap, tw, th);
    pp3Path(sv, `M${cut} 0H${tw - cut}L${tw} ${cut}V${th}H0V${cut}Z`, pp.a(ink, dark ? 0 : 0.14), hair);
    // 구멍: 덧댄 종이 고리 + 뚫린 자리
    const ring = Math.round(u * 0.034), hole = Math.round(u * 0.0135);
    pp.el(tag, `left:${hx - ring}px;top:${hy - ring}px;width:${ring * 2}px;height:${ring * 2}px;border-radius:50%;background:${pp.a(api.tone(3), 0.42)};box-shadow:inset 0 0 0 ${hair}px ${pp.a(ink, 0.1)};`);
    pp.el(tag, `left:${hx - hole}px;top:${hy - hole}px;width:${hole * 2}px;height:${hole * 2}px;border-radius:50%;background:${api.bg};box-shadow:inset 0 ${hair}px ${hair * 2}px rgba(0,0,0,.25);`);
    // 끈: 구멍에서 나와 느슨하게 한 바퀴 돌아 다시 구멍으로
    const k = u * 0.01;
    const string = pp.stroke(sv, pp.curve([[hx - k * 0.3, hy], [hx - k * 2.4, hy - k * 7], [hx + k * 1.5, hy - k * 14], [hx + k * 10, hy - k * 17.5], [hx + k * 17.5, hy - k * 13.5], [hx + k * 14.5, hy - k * 7.5], [hx + k * 5.5, hy - k * 3.6], [hx + k * 0.5, hy + k * 0.2]]), api.accent, Math.max(1.2, u * 0.0042));
    const mono = (px, a) => `font:500 ${px}px/1.2 ${kit.mono};letter-spacing:.14em;white-space:nowrap;color:${pp.a(ink, a)};`;
    const label = pp.slip(tag, `left:${pad}px;top:${u * 0.128}px;` + mono(u * 0.015, 0.55), LABEL);
    const date = pp.slip(tag, `right:${pad}px;top:${u * 0.128}px;` + mono(u * 0.015, 0.55), DATE);
    const title = pp.slip(tag, `left:${pad - u * 0.002}px;top:${u * 0.154}px;font:600 ${u * 0.047}px/1.3 ${kit.serif};letter-spacing:-.03em;color:${ink};`, TITLE);
    const rule = pp.rule(tag, pad, bodyY - Math.round(u * 0.014), tw - pad * 2, pp.a(ink, 0.85));
    // 준비물 줄: 글 … 점선 … 체크 칸
    const rw = tw - pad * 2, b = Math.round(u * 0.031), cy = rowH / 2;
    const rows = ITEMS.map((text, i) => {
      const mask = pp.el(tag, `left:${pad}px;top:${bodyY + i * rowH}px;width:${rw}px;height:${rowH}px;overflow:hidden;`);
      const row = pp.el(mask, 'left:0;top:0;width:100%;height:100%;will-change:transform;');

    const refit = () => { if (frame && (frame.fonts || drew)) { size = ''; build(); } };
    if (document.fonts && document.fonts.addEventListener) document.fonts.addEventListener('loadingdone', refit);
    ro.observe(root);
    io.observe(root);
    sync();
  
    return {
      play() { want = true; sync(); },
      pause() { want = false; sync(); },
      restart() { time = 0; if (frame) frame(time); },
      seek(t) { time = t; if (frame) frame(time); if (watch) mend(watch.takeRecords()); },
      now() { return time; },                       // 지금 몇 초의 장면인지 (발표기에서 씀)
      motion() { return frame; },                   // 모션이 돌려준 장면 함수 (frame.steps 같은 정보를 읽을 때)   // t초의 장면으로 건너뜀 (영상으로 한 장씩 찍을 때)
      slots() { return used.size || usedArt.size; },   // 이 장면이 쓰는 그림 칸 수 (사이트의 '내 사진' 칸)
      destroy() { want = false; sync(); if (LIVE) Object.keys(hands).forEach(k => root.removeEventListener(k, hands[k])); ro.disconnect(); io.disconnect(); if (watch) watch.disconnect(); clearTimeout(timer); if (document.fonts && document.fonts.removeEventListener) document.fonts.removeEventListener('loadingdone', refit); if (frame && frame.dispose) frame.dispose(); root.textContent = ''; }
    };
  }

  qmEngine(document.getElementById('qm-tag-checklist'), CONFIG, tagChecklist);
})();
</script>
